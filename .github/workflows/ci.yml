name: ci

# PR-time gate for the shell that runs on the node. The image build is long and
# runs on release; nothing before this workflow checked the rootfs-overlay
# scripts on a pull request, so a syntax error or a silently-inverted boot
# decision could only be found by flashing hardware.
#
# Scope is deliberately narrow: syntax on every overlay and test script (POSIX
# sh for the overlay, and each test script under the shell its shebang names —
# test/boot-smoke.sh is the one that needs the check, because nothing on a pull
# request runs it), the node-id helper table tests, firstboot's seed handling
# and the join-token file migration run against a scratch directory, the
# at-rest mode audit against synthetic trees, plus the fallback-address suite,
# which fakes networkd's lease directory and /sys/class/net so a boot-time
# decision is testable without a network, a root shell, or a DHCP server to
# take away.
#
# One job goes further than the overlay scripts: rootfs-shadow checks out the
# pinned Buildroot and runs its own mkusers over a target dir prepared by
# post-build.sh, because where in the build the /etc/shadow swap happens is
# itself load-bearing and used to be provable only by a release build.
#
# The fallback address also gets a functional test against real
# systemd-networkd 256.17 (the image's version) in a privileged container,
# because what went wrong in geekdojo-brain#427 lives between networkd, the
# kernel and systemd's path units, and no stub can show it. The core-dump
# policy gets one for the same reason: it is nothing but systemd configuration,
# so only real systemd can say whether it means what it says.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check the rootfs-overlay and test scripts
        # The image's /bin/sh is not bash; check with dash so a bashism fails
        # here rather than at boot on the node.
        #
        # test/ is checked for a different reason. Most suites in there are run
        # by a step below, so their syntax is checked as a side effect of
        # running them — but test/boot-smoke.sh is not run by anything on a
        # pull request. It needs QEMU and a built image, so it executes only on
        # a tag push or a full_build/publish dispatch of release.yml, which
        # means a typo in it used to be discovered by a release build: the one
        # run where a stopped pipeline costs the most, and the run that is
        # least convenient to repeat.
        #
        # THE CHECKER FOLLOWS THE SHEBANG, and it has to. board/ is entirely
        # #!/bin/sh and must stay that way, but two of the test scripts are bash
        # on purpose — release-target-guard-test.sh and verify-bundle-test.sh
        # are CI-side and never run on a node — and dash -n rejects both of
        # them outright today, on a process substitution and on an array
        # literal. A flat `dash -n` over test/ would simply be red.
        #
        # What this buys, stated exactly so nobody over-reads it: -n is a PARSE
        # check. It catches an unbalanced case/if/quote, and it catches the
        # bashisms that are syntax to dash (arrays, <<<, <(...), `function`).
        # It does NOT catch the ones that parse and only fail when run, [[ ]]
        # and ${a[0]} among them. It is a syntax gate, not a POSIX-purity gate.
        #
        # A shebang this step does not recognise is a failure rather than a
        # skip: it means nothing checked that file, which is the state this
        # step exists to end.
        run: |
          fail=0
          for f in $(find board test -name '*.sh' -type f); do
            shebang=$(head -1 "$f")
            case "$shebang" in
              '#!/bin/sh') checker=dash ;;
              *bash) checker=bash ;;
              *) echo "::error file=$f::unrecognised shebang '$shebang' — this step does not know which shell to syntax-check it with"; fail=1; continue ;;
            esac
            "$checker" -n "$f" || { echo "::error file=$f::$checker syntax error"; fail=1; }
          done
          exit $fail
      - name: Controlplane fallback-address tests
        run: sh test/fallback-address-test.sh
      # The wired uplink's DHCP client-id. /etc is a read-only squashfs, so the
      # machine-id is transient and networkd's default DUID client-id changes on
      # every reboot — the DHCP server sees a new client and hands out a new
      # address (measured on the bench: one MAC, two live leases, .232 then
      # .231). ClientIdentifier=mac is what stops it, and dropping it would look
      # identical in a build and in a boot log, so it is pinned here.
      - name: Wired uplink config tests
        run: sh test/wired-network-test.sh
      # The image's clock floor is an mtime on an empty file: a build that
      # silently stops baking it looks identical and puts every offline first
      # boot back to minting already-expired certificates
      # (geekdojo/rasputin-os#1). Nothing downstream would notice, so it is
      # pinned here.
      - name: Image clock-floor tests
        run: sh test/clock-floor-test.sh
      # The firewall image descriptor the image bakes for an offline control
      # plane (geekdojo/geekdojo-brain#595). Two small files nothing reads on a
      # healthy network, so a build that stopped baking them ships an image that
      # looks identical and strands the one operator who needs them — a
      # greenfield bring-up with no route to the internet. Pinned here: the pin
      # parses, and every way the bake can go wrong (no pin, a malformed pin, a
      # failed fetch, a bad signature, no trust root) fails the build instead.
      # Real openssl over a throwaway PKI; a stub curl serves a fake release
      # tree, so nothing here touches the network.
      - name: Baked firewall manifest tests
        run: sh test/firewall-manifest-test.sh
      # The node id becomes the hostname and the username the agent presents to
      # the bus, which accepts only a DNS label; an id that breaks the rule
      # boots fine and never joins. Table tests for the shared helpers under
      # dash, bash and busybox ash (Buildroot's default /bin/sh; REQUIRE_BUSYBOX fails
      # the step if the runner ever stops shipping it). (geekdojo/geekdojo-brain#441)
      - name: Node-id helper tests
        env:
          REQUIRE_BUSYBOX: "1"
        run: sh test/node-id-test.sh
      # Firstboot's seed handling for bus TLS (geekdojo/geekdojo-brain#448): the
      # pin reaches node.env on every role; the controlplane's bus key is written
      # 0600 to bus/bus.key, never over an existing one, never into node.env, and
      # scrubbed from the seed; malformed values fail provisioning before anything
      # is stamped. A join token without a node id fails the same way — the token
      # is bound to an id, so the node never derives one (geekdojo/geekdojo-brain#423).
      # The real script runs against a scratch dir under dash, bash and busybox
      # ash, with keys generated by openssl per run.
      - name: Firstboot seed tests
        env:
          REQUIRE_BUSYBOX: "1"
        run: sh test/firstboot-test.sh
      # The core-dump policy decides which unit may write a core and who can
      # read one. The script half of it is the ExecStopPost that tightens a
      # stored core to 0600 — pinned here against dash, bash and busybox ash
      # plus busybox's own find/chmod, because the image's are busybox's. The
      # systemd half is the coredump-functional job below.
      - name: Coredump mode-restriction tests
        env:
          REQUIRE_BUSYBOX: "1"
        run: sh test/coredump-mode-test.sh
      # The join token moves out of node.env into its own 0600 file
      # (geekdojo/geekdojo-brain#537). The migration rewrites, on every boot, the
      # file that holds a fielded node's only bus credential, so what is pinned
      # here is that it is idempotent, that it never leaves a node with neither
      # form, and that it leaves a controlplane and a dev box alone.
      - name: Join-token file migration tests
        env:
          REQUIRE_BUSYBOX: "1"
        run: sh test/jointoken-file-test.sh
      # The console root password (geekdojo/geekdojo-brain#546): the helper the
      # control plane's push invokes, and the image declarations that make it
      # able to work at all. Two failure modes here are silent — a console that
      # admits anybody (the image used to bake one public password), and a
      # half-written /etc/shadow, which locks every account out of a headless
      # box. Every refusal case asserts the file was not touched.
      - name: Console root password tests
        env:
          REQUIRE_BUSYBOX: "1"
        run: sh test/console-root-hash-test.sh
      # The at-rest mode audit (geekdojo/geekdojo-brain#494): the script that
      # runs on every boot and whose verdict the QEMU smoke asserts. The smoke
      # only runs on a tag, so the audit's LOGIC is pinned here instead —
      # nearly every case is a synthetic tree it must refuse. Also checks the
      # image's own declarations: no unit sets a UMask, and every directory the
      # inventory expects is created with a mode by something in this tree.
      - name: At-rest mode audit tests
        env:
          REQUIRE_BUSYBOX: "1"
        run: sh test/atrest-modes-test.sh
      # release.yml's publish step runs scripts/release-target-guard.sh before
      # and after `gh release create` to prove the tag is on the commit the
      # images were built from. Every exit status, against a throwaway git
      # remote with lightweight, annotated and nested tags. CI-side bash, not
      # the image's shell.
      - name: Release target guard tests
        run: bash test/release-target-guard-test.sh

  # The /etc/shadow swap is a BUILD-ORDER claim, and nothing here used to test
  # the build. cc74fb4 put the swap in post-build.sh, where Buildroot's mkusers
  # still comes along afterwards and does `sed -i --follow-symlinks` on
  # /etc/shadow — a hard error on a dangling link. main could not produce an
  # image on either arch and every PR check stayed green, because the only
  # thing that reaches squashfs is the ~25-minute release build, which does not
  # run on a pull request. This job runs the pinned Buildroot's OWN mkusers over
  # a target dir prepared by post-build.sh, in the build's order, so that class
  # of failure fails here in about a minute instead. It also pins the
  # anti-baked-password guard (geekdojo/geekdojo-brain#546, F14).
  rootfs-shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The same pinned checkout release.yml uses, so the mkusers this runs is
      # the mkusers the image build runs. Shallow; ~1 minute.
      - name: Check out the pinned Buildroot
        run: ./scripts/init-buildroot.sh
      - name: Rootfs /etc/shadow ordering + baked-password guard
        run: sh test/rootfs-shadow-test.sh

  # release.yml's sign step runs scripts/verify-bundle.sh on every signed
  # .raucb: rauc info under the system.conf + keyring read out of that SKU's
  # rootfs, so a bundle CI publishes is one a node on the image accepts
  # (geekdojo/geekdojo-brain#532). That step only runs on a publish, so its
  # behaviour is pinned here against a throwaway PKI and both SKUs' real
  # rauc-system.conf: the production leaf profile passes, a wrong-purpose leaf
  # fails, and the outcome follows the config's [keyring] check-purpose.
  verify-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install rauc + squashfs-tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rauc squashfs-tools
      - name: Bundle verification tests
        run: bash test/verify-bundle-test.sh

  fallback-address-functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fallback address against real networkd (no DHCP, DHCP, late lease, carrier flap)
        run: sh test/fallback-address-functional.sh

  # The console root password's arrangement (geekdojo/geekdojo-brain#546) is
  # one tmpfiles.d line and a symlink, and the claim it rests on is a claim
  # about what systemd does with a C line. Wrong one way, every boot reverts a
  # delivered password; wrong the other, /etc/shadow is created world-readable
  # on every node. Runs against real systemd-tmpfiles 256.17, the image's
  # version, in a container.
  console-shadow-functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Console shadow against real systemd-tmpfiles (seed, preserve, tighten, symlink)
        run: sh test/console-shadow-functional.sh

  # The core-dump policy is configuration only — a manager default, one unit's
  # LimitCORE, a StateDirectoryMode and an ExecStopPost — so nothing in the
  # build can show whether systemd reads it the way we do. It matters because
  # a core is a copy of a crashing process's memory and lands on the persistent
  # partition: the wrong reading means every service can write its secrets to
  # disk. Runs against real systemd 256.17, the image's version, in a
  # privileged container. Note it changes kernel.core_pattern on the runner for
  # part of the run and restores it.
  coredump-functional:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Coredump policy against real systemd (limit scoping, store and core modes)
        run: sh test/coredump-functional.sh
