name: release

# Cross-compile + ship (locked CI v1 posture — no QEMU/hardware boot-test
# yet). See os-images/release-pipeline.md.
#
# SCAFFOLD GATE: this repo is a scaffold. The full Buildroot image build
# cannot succeed yet — the defconfigs carry starter kernel/BSP options and
# the package .mk files need a matching control-plane release to download
# (see README "Status"). So the heavy `build` job runs ONLY on a release
# tag or an explicit opt-in dispatch; every push gets the cheap `validate`
# job instead, so the repo isn't perpetually red while it's a scaffold.
#
# Triggers:
#   - push of a CalVer tag (e.g. 2026.07.1)  → validate + build + release
#       · bare CalVer (2026.07.1)             → stable channel
#       · -dev tag    (2026.07.1-dev.N)       → dev channel (legacy/manual)
#   - manual dispatch (full_build=false, publish=false) → validate only
#   - manual dispatch (full_build=true,  publish=false) → validate + build, no publish (bench)
#   - manual dispatch (publish=true)                    → build + sign + publish a
#       dev release to the public channel, versioned ${vars.RASPUTIN_VERSION}-dev.<run>.
#       This is how dev releases are cut now — the dev.N is the workflow run number
#       (monotonic, gaps OK), NOT a hand-incremented tag counter. The release base
#       (YYYY.MM.MICRO) comes from the org var RASPUTIN_VERSION (the current dev
#       target, shared across rasputin-os / -control-plane / -openwrt-firewall for
#       lockstep). Bump that var when cutting a stable release; see the
#       rasputin-os-release skill.

on:
  push:
    tags:
      - "[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9]*"
  workflow_dispatch:
    inputs:
      full_build:
        description: "Attempt the full Buildroot build (needs real BSP defconfigs + a published control-plane release; will fail until then)"
        type: boolean
        default: false
      publish:
        description: "Sign + publish this build as a dev release to the public channel (versioned from org var RASPUTIN_VERSION). Implies full_build."
        type: boolean
        default: false

permissions:
  contents: write   # create releases + upload assets

env:
  # Node 20 is EOL on GitHub runners (forced off by June 2026). Opt the JS
  # actions (checkout, cache, upload/download-artifact) into Node 24 now —
  # clears the deprecation warning.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Always-on, fast, deterministic. Confirms the external tree is structurally
  # sane without a multi-hour Buildroot run. Green at the scaffold stage.
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell script syntax
        run: |
          set -e
          for f in scripts/*.sh \
                   board/rasputin/common/*.sh \
                   board/rasputin/common/rootfs-overlay/usr/lib/rasputin/*/*.sh; do
            echo "bash -n $f"; bash -n "$f"
          done
      - name: External tree structure
        run: |
          set -e
          req="external.desc external.mk Config.in
               configs/rasputin_rpi_defconfig configs/rasputin_n100_defconfig
               package/rasputin-agent/rasputin-agent.mk
               package/rasputin-api/rasputin-api.mk
               board/rasputin/rpi/genimage.cfg
               board/rasputin/n100/genimage.cfg
               board/rasputin/common/post-image.sh"
          for f in $req; do
            test -f "$f" && echo "ok  $f" || { echo "MISSING $f" >&2; exit 1; }
          done
          grep -q '^name: RASPUTIN' external.desc
          echo "external tree structure OK"

  build:
    needs: validate
    permissions:
      contents: write # matches the workflow default (the vendored-binary fetch reads the public control-plane repo)
      actions: write  # prune superseded br-<sku>-* cache entries (10 GB repo budget)
    # Scaffold gate — see the header comment.
    # full_build arrives as a real boolean from the UI checkbox but as the
    # STRING "true" via the API / `gh -f`. Accept both. (Defaults to false
    # if the input wasn't set at all.)
    if: ${{ startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && (inputs.full_build == true || inputs.full_build == 'true' || inputs.publish == true || inputs.publish == 'true')) }}
    # Both SKUs build on the 16-core larger runner (16 vCPU / 64 GiB / 600 GB,
    # x86-64 — Buildroot cross-compiles arm64 fine, nothing is emulated).
    #
    # Measured A/B, run 35664766508 (stock) vs 35669561845 (16-core), both
    # restoring the same warm ccache:
    #   rpi   Build 3158s -> 1782s,  job 3282s -> 1989s
    #   n100  Build 2418s -> ~1510s (estimated; n100 was the stock control)
    # Scaling by phase: kernels 3.07x, host-go 1.82x, host-gcc ~1.4x.
    #
    # This is METERED compute — $0.042/min per job, no included minutes, and
    # not free even though this repo is public. At the current ~62 builds/mo
    # that is roughly $150-180/mo, bought deliberately to hold the release
    # wall clock near 35m instead of 55m. Revert by setting this back to
    # ubuntu-latest; nothing else depends on the runner size (BR2_JLEVEL is
    # unset, so Buildroot derives -j from the host CPU count on its own).
    #
    # The runner is an org-level GitHub-hosted larger runner in the
    # "public-larger-runners" group, which is scoped to this repository and is
    # the only group with allows_public_repositories set.
    runs-on: ubuntu-24-16core
    strategy:
      fail-fast: false
      matrix:
        # v1 scope (revised 2026-06-23): CM5/arm64 is back IN scope for compute
        # + controlplane nodes (decision #4 re-opened — some design partners
        # only have Raspberry Pis, so the cluster must support arm64 from the
        # start; firewall stays N100-only). The control-plane/UI side already
        # serves a per-arch image (Add-node arch picker → /api/cluster/node-image
        # ?arch=).
        #
        # Both SKUs — n100 (amd64) and rpi (arm64: Pi 4 / Pi 5 / CM5) — are built
        # AND published on every release. arm64 is first-class v1 ship scope, so
        # there is no per-arch publish gate: a release always ships every built
        # SKU (gate retired 2026-07-04). Both are now boot-smoked before publish
        # (smoke-amd64 / smoke-arm64). The arm64 smoke runs the SAME assertions
        # on QEMU's `virt` machine — it does NOT emulate a Pi, so the EEPROM
        # bootloader, autoboot.txt boot_partition switching and the one-shot
        # tryboot flag remain unproven by CI and stay a manual bench step.
        include:
          - sku: rpi
            defconfig: rasputin_rpi_defconfig
            arch: arm64
            compatible: rasputin-rpi-arm64
          - sku: n100
            defconfig: rasputin_n100_defconfig
            arch: amd64
            compatible: rasputin-n100
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false   # Buildroot is added by the init script (pinned)

      - name: Compute version (CalVer)
        id: ver
        # TARGET_VERSION = the org var RASPUTIN_VERSION (current dev target,
        # YYYY.MM.MICRO), shared across the three Rasputin repos for lockstep.
        # Only the dispatch (dev) path reads it; tagged releases use the tag.
        env:
          TARGET_VERSION: ${{ vars.RASPUTIN_VERSION }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            # `-dev` suffix in the tag → dev channel (e.g. 2026.07.1-dev.1).
            # Plain CalVer (e.g. 2026.07.1) → stable.
            case "${GITHUB_REF_NAME}" in
              *-dev*) echo "channel=dev"    >> "$GITHUB_OUTPUT" ;;
              *)      echo "channel=stable" >> "$GITHUB_OUTPUT" ;;
            esac
          else
            # Dev build: base from the org var, dev.N = this workflow's run
            # number (monotonic per repo; gaps from skipped/failed runs are fine).
            if [ -z "${TARGET_VERSION}" ]; then
              echo "::error::org var RASPUTIN_VERSION is unset — set it to the current dev target (e.g. 2026.07.1): gh variable set RASPUTIN_VERSION --org geekdojo --body 2026.07.1 --visibility all"
              exit 1
            fi
            echo "version=${TARGET_VERSION}-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Init Buildroot (pinned release)
        run: ./scripts/init-buildroot.sh

      # Restore the Buildroot download dir + ccache. Warm ccache: kernel +
      # packages recompile in minutes vs ~2-3 h cold. (release-pipeline.md §6)
      #
      # SPLIT restore/save (not the one-shot actions/cache): the unified action
      # only saves on job SUCCESS, so a build that fails mid-bring-up would
      # never warm the cache and every retry stays cold. The discrete save
      # step below runs with `if: always()`.
      #
      # ccache lives at the default $HOME/.buildroot-ccache (BR2_CCACHE=y, no
      # dir override needed). dl is workspace-relative (BR2_DL_DIR).
      # Key on real, checked-in files, computed once and reused by the restore,
      # the save and the prune below.
      #
      # NOT buildroot/.git/HEAD — that's a submodule gitlink file, not a
      # hashable path, and breaks hashFiles ("template is not valid").
      #
      # The key used to cover only the defconfig + the init script (which pins
      # the Buildroot tag), and that quietly broke the cache. 5a9856c (#100)
      # added CONFIG_PCI_HOST_GENERIC and CONFIG_VIRTIO_PCI/_BLK/_NET to
      # board/rasputin/rpi/linux.fragment. A fragment change rewrites the
      # generated autoconf.h, which nearly every kernel translation unit
      # includes, so nearly every kernel object missed in ccache — but the KEY
      # was unchanged, so the restore was an exact hit, so the save below was
      # skipped by its own cache-hit condition and the newly compiled objects
      # were thrown away at the end of the job. Every later rpi build repeated
      # the full compile, forever. Measured across 5a9856c, same restored key
      # br-rpi-39177704…: primary kernel Building 6m23s -> 19m24s, the second
      # (bcm2711) kernel in post-build.sh 6m29s -> 19m06s, whole arm64 job
      # 54m49s -> 81m15s. n100 escaped only because its fragment last changed
      # before its defconfig did.
      #
      # So: the fragments and post-build.sh (which compiles the rpi's SECOND
      # kernel) are part of the key now — it describes what actually determines
      # the build — and the key carries the run id so the save always writes.
      - name: Compute Buildroot cache key
        id: brkey
        env:
          BR_CACHE_HASH: ${{ hashFiles(format('configs/{0}', matrix.defconfig), 'scripts/init-buildroot.sh', format('board/rasputin/{0}/*.fragment', matrix.sku), 'board/rasputin/common/post-build.sh') }}
        run: |
          set -euo pipefail
          # hashFiles returns the empty string when NOTHING matched, which would
          # silently produce a degenerate key. A typo'd path must stop the line.
          test -n "${BR_CACHE_HASH}" \
            || { echo "::error::Buildroot cache key hashed no files — a path in the key expression is wrong"; exit 1; }
          echo "key=br-${{ matrix.sku }}-${BR_CACHE_HASH}" >> "$GITHUB_OUTPUT"

      - name: Restore Buildroot dl + ccache
        id: brcache
        uses: actions/cache/restore@v4
        with:
          path: |
            dl
            ~/.buildroot-ccache
          # Rolling key: <sku>-<hash>-<run id>. The run id makes the primary key
          # unique per run, so every run restores through restore-keys (a prefix
          # match on the newest entry) and then writes its own objects back
          # under a fresh key. That is what lets the ccache re-warm itself after
          # a change that invalidates its contents without changing the hash.
          key: ${{ steps.brkey.outputs.key }}-${{ github.run_id }}
          # In order: the newest entry for this exact source state; then any
          # entry for this SKU; then the rpi cache for warm-start — pi4 shares
          # the fork kernel tarball (dl/) + the glibc/A72 toolchain ccache with
          # rpi, so it isn't a fully-cold ~2h build. Harmless for n100
          # (content-addressed ccache won't match the x86 toolchain).
          restore-keys: |
            ${{ steps.brkey.outputs.key }}-
            br-${{ matrix.sku }}-
            br-rpi-

      - name: Inject trust root
        run: |
          # CI injects the PUBLIC root CA cert (not a secret) into the rootfs
          # overlay before the build. The signing LEAF key is applied later,
          # in a discrete step, never in the build job.
          echo "${{ vars.RASPUTIN_ROOT_CA_PEM }}" \
            > board/rasputin/common/rootfs-overlay/etc/rasputin/trust/root-ca.pem

      # There used to be a "Free disk space" step here, deleting the
      # preinstalled dotnet/android/ghc/CodeQL/boost trees (~25-30 GB) because
      # Buildroot overflowed the free space on a stock hosted runner and died
      # mid-compile with a truncated log. The 16-core larger runner this job
      # now uses has a 600 GB disk: measured in run 35669561845, 581 GB total
      # with 547 GB free even AFTER that reclaim, against a peak build usage
      # well under 100 GB. The reclaim bought nothing and cost 2m16s of
      # METERED runner time per job — ~4m30s per build across the two SKUs.
      #
      # Only the `df -h /` survives, as evidence for the postmortem if a build
      # ever dies that way again. If this job is ever moved back to
      # ubuntu-latest, check the headroom before trusting its absence.
      - name: Report disk space
        run: df -h /

      # The agent/api binaries live in the (now-public) control-plane release.
      # Pre-place the tarballs into Buildroot's dl/ cache here. Each package
      # carries a .hash file (copied from the release's *.hash assets), so
      # Buildroot's dl-wrapper checks the cached tarball against it: a match
      # skips the network fetch, a mismatch forces a re-download from the .mk's
      # _SITE. github.token reads the public repo (this was a
      # fine-grained PAT while control-plane was private — ADR-0002). See
      # os-images/release-pipeline.md §1 ("Fetching the vendored agent/api binaries").
      - name: Fetch vendored binaries (control-plane release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          arch='${{ matrix.arch }}'        # amd64 (n100) | arm64 (cm5)
          dl='${{ github.workspace }}/dl'
          fetch() {
            pkg=$1
            var=$(printf '%s' "$pkg" | tr 'a-z-' 'A-Z_')   # rasputin-agent → RASPUTIN_AGENT
            ver=$(sed -n "s/^${var}_VERSION = //p" "package/$pkg/$pkg.mk" | tr -d '[:space:]')
            test -n "$ver" || { echo "::error::could not parse ${var}_VERSION from package/$pkg/$pkg.mk"; exit 1; }
            src="$pkg-$ver-linux-$arch.tar.gz"
            mkdir -p "$dl/$pkg"
            echo "→ fetching $src into dl/$pkg/"
            gh release download "v$ver" \
              --repo geekdojo/rasputin-control-plane \
              --pattern "$src" \
              --dir "$dl/$pkg" \
              --clobber
          }
          fetch rasputin-agent
          fetch rasputin-api
          echo "----- dl/ tarballs -----"; find "$dl" -name '*.tar.gz' -print

      # Pre-pull + save the mesh container images (self-hosted Headscale) for
      # the target arch so post-build.sh can bake them into the rootfs. The
      # controlplane then forms its mesh on first boot WITHOUT internet (the
      # supervisor finds the loaded image by its recorded ID and skips the
      # pull). --platform so the cm5 (arm64) image is fetched correctly on this
      # amd64 runner — we only `docker save` it here, never run it.
      #
      # THE REFS COME FROM THE CONTROL-PLANE RELEASE, not from this repository.
      # board/rasputin/common/mesh-images.list used to carry them, with a
      # comment saying in capitals that the headscale ref "MUST match
      # defaultImage" in rasputin-control-plane — a sync contract enforced by
      # nobody. When the two drifted the baked tarball simply was not matched by
      # the supervisor and it fell back to pulling at runtime: no error, no
      # alert, just a controlplane that silently needs internet on its first
      # boot, which is the one thing baking the image exists to prevent
      # (geekdojo/geekdojo-brain#210, #211). The pin now comes from the SAME
      # control-plane release this image vendors its api from, so the api that
      # reads the pin at runtime and the build that bakes it are one version.
      #
      # It also records the IMAGE ID of each tarball, which is how the api both
      # FINDS and PINS the baked image. `docker save` of a digest-pinned
      # reference writes RepoTags null and `docker load` records no RepoDigest
      # in the classic image store, so the loaded image has no name to look up;
      # the ID is what survives, and it is read out of the saved tarball here,
      # where the digest pin still holds. See os-images/buildroot-os.md §8.
      - name: Bake mesh container images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          scripts/bake-mesh-images.sh '${{ matrix.arch }}' \
            '${{ github.workspace }}/mesh-images'

      - name: Build
        env:
          RASPUTIN_VERSION: ${{ steps.ver.outputs.version }}
          BR2_DL_DIR: ${{ github.workspace }}/dl
          # NOTE: no SSH key is injected here — deliberately. The build CANNOT
          # bake an authorized key (the pre-GA vendor-key removal, 2026-07-09);
          # keys arrive exclusively via RASPUTIN_SSH_AUTHORIZED_KEY in
          # rasputin-seed.env, for us and for end users alike.
          # Mesh image tarballs from the "Bake mesh container images" step;
          # post-build.sh copies them into /usr/share/rasputin/mesh-images.
          RASPUTIN_MESH_IMAGES_DIR: ${{ github.workspace }}/mesh-images
          # A PUBLISHED image must carry the offline firewall descriptor: this
          # is the build where an unverifiable manifest has to stop the line
          # rather than ship an image that boots fine and strands a greenfield
          # bring-up. post-build.sh skips the bake without this, so that a
          # local build and the minimal fixture trees in test/ still work.
          # geekdojo/geekdojo-brain#595.
          RASPUTIN_REQUIRE_FIREWALL_MANIFEST: "1"
        run: |
          make -C buildroot BR2_EXTERNAL=${{ github.workspace }} \
            O=${{ github.workspace }}/output/${{ matrix.sku }} \
            ${{ matrix.defconfig }}
          make -C buildroot BR2_EXTERNAL=${{ github.workspace }} \
            O=${{ github.workspace }}/output/${{ matrix.sku }}

      # Save even when Build fails (if: always) so the next bring-up iteration
      # gets a warm ccache.
      #
      # There is deliberately NO cache-hit condition here any more. The old one
      # (cache-hit != 'true') is what made the poisoned ccache permanent: an
      # exact key hit meant "nothing new to store", which was false whenever the
      # job had done real compilation under an unchanged key. A run that
      # compiles always writes its objects back now. The rolling run id in the
      # key means each save lands on a fresh entry rather than being refused,
      # and the prune step below keeps that from accumulating.
      - name: Save Buildroot dl + ccache
        id: brsave
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            dl
            ~/.buildroot-ccache
          key: ${{ steps.brkey.outputs.key }}-${{ github.run_id }}

      # A repository gets 10 GB of Actions cache in total and these entries run
      # ~2.5 GB each, so a key that writes every run has to clean up after
      # itself — otherwise this fix would cause the very eviction it exists to
      # prevent. Keep only the entry this run just wrote, per SKU; the two SKUs
      # prune disjoint prefixes (br-n100-, br-rpi-) so the parallel matrix jobs
      # cannot step on each other.
      - name: Prune superseded Buildroot caches
        if: always() && steps.brsave.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: br-${{ matrix.sku }}-
          KEEP: ${{ steps.brkey.outputs.key }}-${{ github.run_id }}
        run: |
          set -euo pipefail
          # select(.ref == env.GITHUB_REF) is load-bearing. Actions caches are
          # scoped per ref: a run on a branch or a tag can READ the default
          # branch's entries, but the REST delete below is not ref-aware and
          # would happily delete main's. Without this filter a single
          # workflow_dispatch on a branch — a bench build, a CI experiment —
          # silently destroys the cache main depends on, and main's next build
          # runs fully cold. Only ever prune entries belonging to THIS ref.
          gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq '.actions_caches[] | select(.ref == env.GITHUB_REF) | [.id, .key] | @tsv' > caches.tsv
          # Refuse to delete anything unless the entry we mean to keep is
          # really listed — otherwise a bad KEEP would wipe this SKU's ccache.
          if ! cut -f2 caches.tsv | grep -qxF "$KEEP"; then
            echo "::warning::$KEEP is not in the cache list — pruning nothing"
            exit 0
          fi
          while IFS="$(printf '\t')" read -r id key; do
            case "$key" in
              "$PREFIX"*)
                if [ "$key" = "$KEEP" ]; then continue; fi
                echo "deleting cache $key (id $id)"
                gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/$id" >/dev/null
                ;;
            esac
          done < caches.tsv
          rm -f caches.tsv

      - name: Upload unsigned artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.sku }}-${{ steps.ver.outputs.version }}
          path: |
            output/${{ matrix.sku }}/images/*.img
            output/${{ matrix.sku }}/images/bundle/rootfs.img
            output/${{ matrix.sku }}/images/bundle/manifest.raucm
          # post-image.sh no longer produces a .raucb in the build job —
          # the leaf signing key never enters the build runner. The bundle/
          # contents above are what sign-and-release feeds to `rauc bundle`.

  # Boot-smoke the built images in QEMU — the relaxation of "no boot test in
  # CI" that needs NO hardware. Both SKUs now have one; the assertions live in
  # ONE script (test/boot-smoke.sh) that both jobs call, so they cannot drift
  # apart. Read that script for what is asserted and why each assertion exists.
  #
  # Per-arch notes are on each job below. The shared shape: download the SKU's
  # unsigned .img artifact, seed it as a controlplane, boot it headless, and
  # assert the boot, the provisioning chain, the api/UI/DNS surface and a 70s
  # uptime soak. A red smoke BLOCKS sign-and-release.
  smoke-amd64:
    needs: build
    # Run as long as the workflow wasn't cancelled — !cancelled() decouples
    # smoke from the other matrix entry: with `fail-fast: false`,
    # needs.build.result is 'failure' if ANY matrix entry failed, which would
    # otherwise skip this job when n100 built fine but rpi didn't. If n100 also
    # failed, the artifact-download step below surfaces that cleanly.
    #
    # full_build arrives as a real boolean from the UI checkbox but as the
    # STRING "true" via the API / `gh -f`. Accept both. (Defaults to false
    # if the input wasn't set at all.)
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && (inputs.full_build == true || inputs.full_build == 'true' || inputs.publish == true || inputs.publish == 'true'))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU + OVMF (UEFI firmware) + mtools
        run: |
          sudo apt-get update
          # bind9-dnsutils: dig, for the CP-nameserver assertion (the api's DNS
          # listener is queried through a hostfwd, not grepped). sfdisk + jq are
          # preinstalled on the runner image.
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf mtools bind9-dnsutils
      - uses: actions/download-artifact@v4
        with:
          pattern: n100-*
          merge-multiple: true
          path: img
      - name: Boot headless and assert
        run: |
          set -x
          IMG=$(ls img/*.img | head -1)
          test -n "$IMG" || { echo "::error::no n100 .img artifact"; exit 1; }
          test/boot-smoke.sh amd64 "$IMG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-amd64-console
          path: /tmp/console.log

  # The arm64 half of the same test. WHAT IT DOES NOT PROVE, stated here rather
  # than only in the PR that added it, because this is where someone will read
  # it: QEMU is not a Raspberry Pi. This job boots the image's own kernel and
  # its own cmdline.txt on QEMU's generic `virt` machine. The Pi's EEPROM
  # bootloader stage, the selector FAT's autoboot.txt `boot_partition` A/B
  # switch, the one-shot `tryboot` flag, config.txt's [pi4]/[pi5] kernel
  # selection and start4.elf are FIRMWARE behaviour that nothing here executes.
  # A green smoke-arm64 says the arm64 rootfs, kernel, units, provisioning chain
  # and the arm64 rasputin-agent/api binaries work. It says NOTHING about
  # whether a Pi would boot this card, and nothing about whether a RAUC update
  # would switch slots on one. Those stay bench-only, on real Pi 4 / Pi 5 / CM5
  # hardware. Do not read this job as Pi coverage.
  #
  # It also boots only kernel_2712.img (Pi 5 / CM5). The image's second kernel,
  # kernel8.img (Pi 4 / bcm2711, built by post-build.sh), is not booted here.
  smoke-arm64:
    needs: build
    # Same !cancelled() reasoning as smoke-amd64 above, mirrored: an n100 build
    # failure must not skip the arm64 smoke.
    if: ${{ !cancelled() && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && (inputs.full_build == true || inputs.full_build == 'true' || inputs.publish == true || inputs.publish == 'true'))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU (aarch64) + mtools
        run: |
          sudo apt-get update
          # qemu-system-arm ships qemu-system-aarch64. No OVMF: the `virt` guest
          # is booted with -kernel, not through UEFI.
          sudo apt-get install -y --no-install-recommends qemu-system-arm mtools bind9-dnsutils
          qemu-system-aarch64 --version | head -1
      - uses: actions/download-artifact@v4
        with:
          pattern: rpi-*
          merge-multiple: true
          path: img
      - name: Boot headless and assert
        run: |
          set -x
          IMG=$(ls img/*.img | head -1)
          test -n "$IMG" || { echo "::error::no rpi .img artifact"; exit 1; }
          test/boot-smoke.sh arm64 "$IMG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-arm64-console
          path: /tmp/console.log

  # Discrete signing + publish job — the leaf key is scoped to HERE and nowhere
  # else. It comes from this repository's `signing` environment, is staged and
  # preflighted by the organisation's shared rasputin-sign action onto an
  # in-memory tmpfs for the duration of `rauc bundle`, and is wiped at the end
  # of the job. (release-pipeline.md §3, geekdojo/geekdojo-brain#524)
  #
  # Only on a CalVer tag push. To exercise this path before a real release
  # cut, push a `-dev.N` suffixed tag (e.g. 2026.05.0-dev.1) — same shape,
  # marked as prerelease.
  sign-and-release:
    needs: [build, smoke-amd64, smoke-arm64]
    # A failing smoke must BLOCK publication. It did not: `!cancelled()` in the
    # condition below meant the job ran on any non-cancelled outcome, so
    # 2026.07.9-dev.136 published to the dev channel with a red smoke
    # (2026-08-03). A gate that does not gate is worse than no gate — it reads
    # as validation on the release page.
    #
    # Kept as an explicit result check rather than dropping !cancelled(),
    # because that flag is doing separate work: it decouples this job from the
    # build matrix's own result, so one SKU's build failure does not by itself
    # decide this job's condition. Both concerns coexist.
    #
    # BOTH smokes must be green. The rpi SKU used to publish with no boot test
    # of any kind — it was built, signed and released having never been booted,
    # while `!cancelled()` on the arm64 leg was explicitly described as letting
    # "an arm64 hardware-bring-up failure not block an otherwise-good amd64
    # publish". That asymmetry is gone: a release ships both SKUs, so a release
    # is blocked if either SKU fails to boot. If the rpi image is red and an
    # amd64-only publish is genuinely wanted, that is a decision to make
    # explicitly, not a default.
    # Publishes on a tag (stable or legacy -dev tag) OR on a dispatch with
    # publish=true (a run-number-versioned dev release). Bench dispatches
    # (full_build only) skip this and just produce artifacts.
    if: ${{ !cancelled() && needs.smoke-amd64.result == 'success' && needs.smoke-arm64.result == 'success' && (startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && (inputs.publish == true || inputs.publish == 'true'))) }}
    runs-on: ubuntu-latest
    # The release signing credential lives in this repository's `signing`
    # ENVIRONMENT, not in repository- or organisation-level secrets
    # (geekdojo/geekdojo-brain#524). Naming the environment here is what makes
    # its secrets reachable at all, and what makes its deployment-branch policy
    # apply: a job that does not name it gets no leaf and fails the preflight
    # rather than signing with something weaker.
    environment: signing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The exact commit this run built. Every job's checkout (build included)
      # takes the run's github.sha, so this HEAD is the tree the images came
      # from. The release tag must land HERE, not on whatever main points at
      # when the publish step runs an hour later: with no explicit target,
      # GitHub creates a new tag from the default branch at publish time, so a
      # PR merged mid-run tags a commit the image was never built from
      # (2026.09.4-dev.220: built from 8d53577, tagged 4ff4746 after #75 merged).
      - name: Record built commit
        id: src
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Compute version (CalVer, same logic as build)
        id: ver
        env:
          TARGET_VERSION: ${{ vars.RASPUTIN_VERSION }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            if [ -z "${TARGET_VERSION}" ]; then
              echo "::error::org var RASPUTIN_VERSION is unset — cannot publish a dev release"; exit 1
            fi
            VERSION="${TARGET_VERSION}-dev.${GITHUB_RUN_NUMBER}"
          fi
          case "$VERSION" in
            *-dev*) CHANNEL=dev    ; PRERELEASE=true  ;;
            *)      CHANNEL=stable ; PRERELEASE=false ;;
          esac
          echo "version=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL"       >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Install rauc + xz + squashfs-tools
        # squashfs-tools: scripts/verify-bundle.sh reads the device RAUC config
        # out of each SKU's rootfs.img with unsquashfs.
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rauc xz-utils squashfs-tools

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Layout artifacts (one dir per SKU)
        run: |
          set -eu
          ls -R artifacts/ | head -40
          # The build job named each artifact "<sku>-<version>". We get one
          # subdir per SKU containing: <sku>-<version>.img + bundle/{rootfs.img,manifest.raucm}.
          for d in artifacts/*-${{ steps.ver.outputs.version }}; do
            sku=$(basename "$d" | sed "s/-${{ steps.ver.outputs.version }}\$//")
            echo "::group::SKU $sku"
            ls -la "$d" "$d/bundle" 2>/dev/null || true
            echo "::endgroup::"
          done

      # The credential is staged and gated by the organisation's shared action
      # (geekdojo/geekdojo-brain#524), pinned by SHA. It runs the same check set
      # rasputin-control-plane scripts/pki-init.sh runs at mint time, so the
      # three properties this step used to check inline -- the smimesign purpose
      # every deployed board enforces, RAUC's codesign semantics read straight
      # off the extensions, and the Rasputin release OID artifactsig authorises
      # on -- are now checked in one place for every signing repository, and a
      # fourth (the cert secret must carry the intermediate too) comes with it.
      #
      # The reasoning those inline checks carried has moved into the action, not
      # been dropped: read .github/actions/rasputin-sign/action.yml in
      # geekdojo/.github before changing any of them.
      - name: Stage and preflight the signing credential
        id: mat
        uses: geekdojo/.github/.github/actions/rasputin-sign@e94e742453c1a1d0d3426d1b541bd5f1a82f3c4a
        with:
          purpose: release
          leaf-key:  ${{ secrets.RASPUTIN_LEAF_KEY }}
          leaf-cert: ${{ secrets.RASPUTIN_LEAF_CERT }}
          root-ca:   ${{ vars.RASPUTIN_ROOT_CA_PEM }}

      - name: Sign .raucb bundles + compress .img + emit signed manifest
        id: sign
        env:
          # Through the environment, not expanded into the script text: a
          # `${{ }}` inside a run block is substituted before the shell ever
          # sees it, so its value becomes code rather than data. These
          # particular values are paths the signing action just wrote, but the
          # rule is the rule (zizmor template-injection), and a step that
          # follows it is one nobody has to re-reason about later.
          LEAF: ${{ steps.mat.outputs.leaf }}
          INTERMEDIATE: ${{ steps.mat.outputs.intermediate }}
          KEY: ${{ steps.mat.outputs.key }}
          ROOT: ${{ steps.mat.outputs.root }}
        run: |
          set -eu
          mkdir -p release-out
          : > /tmp/manifest-artifacts.jsonl
          for d in artifacts/*-${{ steps.ver.outputs.version }}; do
            sku=$(basename "$d" | sed "s/-${{ steps.ver.outputs.version }}\$//")
            ver="${{ steps.ver.outputs.version }}"

            # Derive arch/compatible from the manifest.raucm the build wrote
            # (matches what's baked into the bundle — single source of truth).
            compatible=$(awk -F'=' '/^compatible=/{print $2}' "$d/bundle/manifest.raucm")
            case "$sku" in n100) arch=amd64 ;; rpi) arch=arm64 ;; esac

            echo "::group::Sign $sku (compatible=$compatible)"
            rauc bundle \
              --cert="$LEAF" \
              --intermediate="$INTERMEDIATE" \
              --key="$KEY" \
              --signing-keyring="$ROOT" \
              "$d/bundle" \
              "release-out/rasputin-os-${sku}-${ver}.raucb"

            # Verify the signed bundle the way a node will: with the
            # /etc/rauc/system.conf and trust root baked into THIS SKU's rootfs
            # (read out of the rootfs.img being shipped), not RAUC's defaults.
            # `rauc bundle` above runs with no --conf, so its signing-time
            # check uses the built-in purpose; a [keyring] setting in the
            # device config (check-purpose, …) is only applied here. A bundle
            # that fails this is one every node on the image would refuse, so
            # it stops the release before anything is published.
            ./scripts/verify-bundle.sh \
              "release-out/rasputin-os-${sku}-${ver}.raucb" \
              "$d/bundle/rootfs.img"

            # Compress the flashable .img (GH release asset limit is 2 GB;
            # our raw .img is ~3 GB so this is mandatory, not just an
            # optimization).
            img_src=$(ls "$d"/*.img | head -1)
            xz --keep --threads=0 -T0 -c "$img_src" > "release-out/$(basename "$img_src").xz"
            echo "::endgroup::"

            raucb="release-out/rasputin-os-${sku}-${ver}.raucb"
            imgxz="release-out/$(basename "$img_src").xz"
            raucb_sha=$(sha256sum "$raucb"  | awk '{print $1}')
            imgxz_sha=$(sha256sum "$imgxz"  | awk '{print $1}')
            raucb_sz=$(stat -c%s "$raucb")
            imgxz_sz=$(stat -c%s "$imgxz")
            built=$(date -u +%Y-%m-%dT%H:%M:%SZ)

            jq -nc \
              --arg sku "$sku" --arg arch "$arch" --arg compatible "$compatible" \
              --arg raucb   "$(basename "$raucb")"  --arg raucb_sha "$raucb_sha" \
              --arg image   "$(basename "$imgxz")"  --arg imgxz_sha "$imgxz_sha" \
              --argjson raucb_sz "$raucb_sz" --argjson imgxz_sz "$imgxz_sz" \
              --arg signedBy "Rasputin Release ${ver}" --arg built "$built" \
              '{sku:$sku, architecture:$arch, compatible:$compatible,
                raucb:$raucb, sha256:$raucb_sha, sizeBytes:$raucb_sz,
                image:$image, imageSha256:$imgxz_sha, imageSizeBytes:$imgxz_sz,
                signedBy:$signedBy, buildDate:$built}' \
              >> /tmp/manifest-artifacts.jsonl
          done

          jq -n \
            --arg version "${{ steps.ver.outputs.version }}" \
            --arg channel "${{ steps.ver.outputs.channel }}" \
            --slurpfile artifacts /tmp/manifest-artifacts.jsonl \
            '{version:$version, channel:$channel, artifacts:$artifacts}' \
            > release-out/manifest.json

          # Detached DER CMS signature over the manifest — the trust anchor
          # for first-flash downloads. The .img.xz images aren't individually
          # signed; their imageSha256 lives in manifest.json, so signing the
          # manifest chains them to the root CA. Same recipe as the firewall
          # repo's sign_file(); the signature embeds leaf + intermediate, so
          # the public root CA alone verifies it:
          #   openssl cms -verify -binary -inform DER \
          #     -in manifest.json.sig -content manifest.json \
          #     -CAfile rasputin-root-ca.pem
          # (root CA: https://rasputin.geekdojo.com/rasputin-root-ca.pem)
          openssl cms -sign -binary \
            -in       release-out/manifest.json \
            -signer   "$LEAF" \
            -certfile "$INTERMEDIATE" \
            -inkey    "$KEY" \
            -outform DER \
            -out      release-out/manifest.json.sig
          echo "----- release-out/ -----" && ls -lh release-out/ && \
            echo "----- manifest.json -----" && cat release-out/manifest.json

      # Prove the published verify command passes before anything is shipped.
      # The .raucb bundles are self-verified above by scripts/verify-bundle.sh,
      # which reads each SKU's own /etc/rauc/system.conf out of the rootfs it is
      # shipping -- RAUC-specific, and not something a generic CMS check can
      # stand in for. manifest.json is a plain detached CMS signature, so it
      # goes through the shared action with the same purpose the first-flash
      # verifier applies.
      - name: Self-verify the signed manifest
        uses: geekdojo/.github/.github/actions/rasputin-sign@e94e742453c1a1d0d3426d1b541bd5f1a82f3c4a
        with:
          mode: verify
          purpose: release
          artifacts: release-out/manifest.json

      - name: Wipe signing material
        if: always()
        uses: geekdojo/.github/.github/actions/rasputin-sign@e94e742453c1a1d0d3426d1b541bd5f1a82f3c4a
        with:
          mode: cleanup

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.ver.outputs.version }}
          # --target pins a NEW tag (dispatch-publish) to the built commit. On a
          # tag push the tag already exists and GitHub ignores target_commitish,
          # so that path is unchanged — and there the checked-out commit is the
          # tagged commit anyway.
          TARGET_SHA: ${{ steps.src.outputs.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          set -eu
          PRERELEASE_FLAG=""
          if [ "${{ steps.ver.outputs.prerelease }}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Before publishing: a tag already on ANOTHER commit would make
          # gh ignore --target and publish these images under it. Refuse
          # (status 1), and refuse if the remote cannot be read (2). Status 0
          # is the tag-push path (the tag is the checked-out commit); 3 means
          # this run creates the tag.
          created_tag=false
          rc=0
          ./scripts/release-target-guard.sh "$REPO_URL" "$TAG" "$TARGET_SHA" || rc=$?
          case "$rc" in
            0) ;;
            3) created_tag=true ;;
            *) echo "::error::refusing to publish $TAG: see release-target-guard above"; exit 1 ;;
          esac

          gh release create "$TAG" \
            --target "$TARGET_SHA" \
            --title "Rasputin OS ${{ steps.ver.outputs.version }}" \
            --notes "Channel: \`${{ steps.ver.outputs.channel }}\`. Verify the chain with the public root CA (https://rasputin.geekdojo.com/rasputin-root-ca.pem): \`manifest.json.sig\` is a detached DER CMS signature over \`manifest.json\`, which carries per-asset SHA-256. Verify commands: https://rasputin.geekdojo.com/docs/agents/." \
            $PRERELEASE_FLAG \
            release-out/*

          # After publishing: prove the tag landed on the built commit. A tag
          # this run created on the wrong commit is deleted with its release so
          # nothing mis-tagged stays published (releases here are immutable, so
          # the dev.N name is burned; the next dispatch gets a new run number).
          # A tag that existed before this step was pushed by a person and is
          # never deleted. Only a proven mismatch (1) deletes; an unreadable
          # remote fails without touching the release.
          rc=0
          ./scripts/release-target-guard.sh "$REPO_URL" "$TAG" "$TARGET_SHA" || rc=$?
          if [ "$rc" != 0 ]; then
            if [ "$rc" = 1 ] && [ "$created_tag" = true ]; then
              echo "::error::deleting release $TAG and its tag: this run created them on the wrong commit"
              gh release delete "$TAG" --cleanup-tag --yes \
                || echo "::error::could not delete release $TAG; delete it and its tag by hand"
            fi
            exit 1
          fi
