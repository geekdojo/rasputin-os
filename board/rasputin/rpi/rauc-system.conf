# RAUC system config — rpi SKU (arm64: Pi 4 / Pi 5 / CM5). Installed to
# /etc/rauc/system.conf.
#
# The Pi has NO official RAUC bootloader backend. We use the `custom` backend
# with a hook script driving the firmware's autoboot.txt `boot_partition`
# switching + one-shot tryboot flag (the canonical Rtone/Bootlin/HAOS approach).
# The image has a SEPARATE selector FAT (p1) + two boot slots (boot-a=p2,
# boot-b=p3), each statically rooting its slot; autoboot.txt (on p1) sets [all]
# boot_partition to the committed slot and [tryboot] to the candidate. The
# partition numbers MUST stay in sync with genimage.cfg + the backend's
# part_for(). The one-shot tryboot IS the rollback: a trial that
# never reaches mark-good reverts on the next normal boot. This runs at the
# EEPROM-bootloader stage (portable Pi 4 + Pi 5) — the earlier single-FAT
# config.txt `[tryboot]` cmdline swap was Pi-5-only (bench 2026-06-27). RAUC
# updates only the rootfs (kernels are not OTA'd), like the n100. CRITICAL:
# unlike GRUB this backend cannot count boot attempts and the firmware will not
# auto-fallback a COMMITTED slot — hence the systemd watchdog + app health-check
# + the reconcile/mark-bad path as defense-in-depth. See os-images/buildroot-os.md §3.

[system]
compatible=rasputin-rpi-arm64
bootloader=custom
# verity bundles: runtime dm-verity integrity (control-plane/updates.md §2)
bundle-formats=verity
# RAUC mounts the bundle here during install. The default (/mnt/rauc) is on the
# read-only squashfs rootfs, so `rauc install` fails ("Read-only file system").
# Point it at tmpfs — mirrors the n100. (Bug: the rpi conf was missing this.)
mountprefix=/run/rauc
# RAUC's own state lives on the persistent partition.
#
# Without this RAUC falls back to per-slot status — which writes into each
# slot's own filesystem — and our slots are `type=raw`, so there is nowhere to
# write and it records NOTHING. It says so on every invocation ("Using per-slot
# statusfile. System status information not supported!") and `rauc status`
# emits no version key at all, which is why the control plane saw an empty
# CurrentVersion from every OS node (geekdojo-brain #82).
#
# What this buys, in order: the INACTIVE slot's installed version becomes
# knowable, so a rollback's destination is known in advance instead of
# discovered after the fact; per-slot install + boot history for diagnostics;
# and the block-hash index that RAUC adaptive (delta) updates require.
#
# It is NOT a second source of truth for what the node is running. That comes
# from /etc/rasputin/image-version on the running rootfs — the rootfs IS the
# booted slot, so it is direct evidence, where RAUC's record is a claim written
# at install time. Both are set from RASPUTIN_VERSION in the same build
# (post-build.sh writes the file, post-image.sh writes the manifest), so for a
# slot RAUC installed they cannot disagree; for a slot it did NOT install
# (a fresh flash) RAUC has no record and the file is the only answer.
#
# Consumers must survive its absence: the directory is empty on a node that has
# not installed since this shipped, so per-slot versions appear one update
# later, not immediately. Until the first write RAUC logs "Failed to load system
# status: No such file or directory" on every invocation — benign, it means the
# status file does not exist yet, and it stops once something is recorded.
# (Bench-checked against RAUC 1.13 on e3bench 2026-08-12: the key is accepted,
# "System status information not supported!" is gone, slots still parse, and
# RAUC creates the directory itself at 0700.)
data-directory=/var/lib/rasputin/rauc

[handlers]
# RAUC custom-backend contract (get/set-primary, get/set-state): the script
# parses + rewrites autoboot.txt's [all]/[tryboot] boot_partition on boot-a and
# tracks a pending-trial marker. The trial reboot itself is `reboot "0 tryboot"`.
bootloader-custom-backend=/usr/lib/rauc/rpi-tryboot-backend.sh

[keyring]
path=/etc/rasputin/trust/root-ca.pem

# Slots addressed by MBR PARTUUID (disk-signature 0x52415350 + partition number),
# not /dev/mmcblk0pN — so the same image boots medium-agnostically: microSD
# (/dev/mmcblk0pN), USB-SSD (/dev/sdaN), or NVMe (/dev/nvme0n1pN, the Pi 5 SSD
# HAT) with no edits. (MBR has no PARTLABEL — that's the n100's GPT scheme; the
# rpi is MBR because the Pi firmware's autoboot.txt boot_partition is broken on
# GPT. rootfs-0 = p5, rootfs-1 = p6 → PARTUUIDs …-05 / …-06. MUST match genimage's
# disk-signature + partition order.)
[slot.rootfs.0]
device=/dev/disk/by-partuuid/52415350-05
type=raw
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partuuid/52415350-06
type=raw
bootname=B
