# RAUC system config — N100 (amd64). Installed to /etc/rauc/system.conf by
# post-build.sh (per-SoC).
#
# UEFI machine → GRUB backend. Unlike the CM5, GRUB's grubenv carries a
# real boot-attempts counter, so the amd64 nodes get bootloader-level
# rollback (RAUC sets <bootname>_OK/_TRY + ORDER; grub.cfg counts attempts and
# falls back). See os-images/buildroot-os.md §3.

[system]
compatible=rasputin-n100
bootloader=grub
bundle-formats=verity
# RAUC mounts the bundle here during install. The default (/mnt/rauc) is on the
# read-only squashfs rootfs, so `rauc install` fails ("Failed creating mount
# path '/mnt/rauc/bundle': Read-only file system"). Point it at tmpfs.
mountprefix=/run/rauc
# RAUC's own state lives on the persistent partition.
#
# Without this RAUC falls back to per-slot status — which writes into each
# slot's own filesystem — and our slots are `type=raw`, so there is nowhere to
# write and it records NOTHING. It says so on every invocation ("Using per-slot
# statusfile. System status information not supported!") and `rauc status`
# emits no version key at all, which is why the control plane saw an empty
# CurrentVersion from every OS node (geekdojo-brain #82).
#
# What this buys, in order: the INACTIVE slot's installed version becomes
# knowable, so a rollback's destination is known in advance instead of
# discovered after the fact; per-slot install + boot history for diagnostics;
# and the block-hash index that RAUC adaptive (delta) updates require.
#
# It is NOT a second source of truth for what the node is running. That comes
# from /etc/rasputin/image-version on the running rootfs — the rootfs IS the
# booted slot, so it is direct evidence, where RAUC's record is a claim written
# at install time. Both are set from RASPUTIN_VERSION in the same build
# (post-build.sh writes the file, post-image.sh writes the manifest), so for a
# slot RAUC installed they cannot disagree; for a slot it did NOT install
# (a fresh flash) RAUC has no record and the file is the only answer.
#
# Consumers must survive its absence: the directory is empty on a node that has
# not installed since this shipped, so per-slot versions appear one update
# later, not immediately. Until the first write RAUC logs "Failed to load system
# status: No such file or directory" on every invocation — benign, it means the
# status file does not exist yet, and it stops once something is recorded.
# (Bench-checked against RAUC 1.13 on e3bench 2026-08-12: the key is accepted,
# "System status information not supported!" is gone, slots still parse, and
# RAUC creates the directory itself at 0700.)
data-directory=/var/lib/rasputin/rauc
# grubenv lives on the ESP, mounted rw at /run/rasputin-esp (a boot-only partition now that the seed has its own FAT).
# RAUC's grub-editenv writes it here on mark-good/mark-bad/activate; GRUB reads
# the same file at boot from its prefix (/EFI/BOOT/grubenv).
grubenv=/run/rasputin-esp/EFI/BOOT/grubenv

[keyring]
path=/etc/rasputin/trust/root-ca.pem

# Slots addressed by GPT PARTLABEL, not /dev/sdaN — the same image boots on
# NVMe (/dev/nvme0n1pN, the Mu) or SATA (/dev/sdaN) without edits.
[slot.rootfs.0]
device=/dev/disk/by-partlabel/rootfs-0
type=raw
bootname=A

[slot.rootfs.1]
device=/dev/disk/by-partlabel/rootfs-1
type=raw
bootname=B
