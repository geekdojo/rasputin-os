# The identity service's runtime options (geekdojo/geekdojo-brain#974,
# Identity 2.6; platform.md §3.5, signin-origin.md §4). Runtime options only:
# the build options are the api tarball's identity/keycloak-build.conf, frozen
# at image build, and `start --optimized` refuses to start on drift from them.
# No secret: every certificate, key and CA is read from this unit's
# credentials, which systemd copies in by LoadCredential= at each start.
# test/identity-config-test.sh pins every line; test/identity-unit-functional.sh
# starts Keycloak on this file under real systemd.
#
# Hostname and proxy (signin-origin.md §4): no hostname, so the door's
# X-Forwarded headers, trusted from loopback only, name the origin.
hostname-strict=false
hostname-backchannel-dynamic=false
proxy-headers=xforwarded
proxy-trusted-addresses=127.0.0.1/32
# HTTPS only, loopback only, TLS 1.3 only. The client certificate the build
# requires (https-client-auth) chains to the identity CA alone.
http-enabled=false
http-host=127.0.0.1
https-port=8543
https-protocols=TLSv1.3
https-certificate-file=/run/credentials/keycloak.service/server.pem
https-certificate-key-file=/run/credentials/keycloak.service/server.key
https-trust-store-file=/run/credentials/keycloak.service/identity-ca.pem
# A new leaf restarts the unit (the api does that), so nothing reloads.
https-certificates-reload-period=-1
# The management listener, loopback only; its scheme and client
# authentication are the HTTPS listener's.
http-management-host=127.0.0.1
http-management-port=8544
# Outbound trust: the controlplane CA, beside the JRE's empty jssecacerts
# (platform.md §3.7), so it is the only root.
truststore-paths=/run/credentials/keycloak.service/mesh-ca.pem
# One control plane: no cluster, so no JGroups listeners.
cache=local
vault-dir=/run/rasputin-identity-vault
# The database: mutual TLS to 127.0.0.1:5432, the server verified by name
# against the identity CA, the client key an unencrypted PKCS-8 file.
db-url-host=127.0.0.1
db-url-port=5432
db-url-database=keycloak
db-username=keycloak
db-url-properties=?sslmode=verify-full&sslrootcert=/run/credentials/keycloak.service/identity-ca.pem&sslcert=/run/credentials/keycloak.service/db-client.pem&sslkey=/run/credentials/keycloak.service/db-client.pk8
db-pool-max-size=8
log=console
