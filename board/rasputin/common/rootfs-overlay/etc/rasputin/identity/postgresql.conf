# The identity database's settings (geekdojo/geekdojo-brain#974, Identity 2.6;
# platform.md §3.5). Written key=value with no spaces, the grammar
# package/keycloak/kc-conf.sh reads, so test/identity-config-test.sh pins
# every line with the one parser. No secret: the certificate files are this
# unit's credentials.
#
# Loopback TCP only, and no Unix socket.
listen_addresses='127.0.0.1'
port=5432
unix_socket_directories=''
# The one line that admits anyone: hostssl, the keycloak role, by client
# certificate. Identity 2.7's initdb -A reject leaves a cluster that refuses
# every connection until this is in force.
hba_file='/etc/rasputin/identity/pg_hba.conf'
ssl=on
ssl_min_protocol_version='TLSv1.3'
ssl_cert_file='/run/credentials/keycloak-db.service/server.pem'
ssl_key_file='/run/credentials/keycloak-db.service/server.key'
ssl_ca_file='/run/credentials/keycloak-db.service/identity-ca.pem'
# Sized for Keycloak's pool of 8 inside the unit's 96M (#957).
max_connections=12
shared_buffers=32MB
work_mem=2MB
max_wal_size=64MB
min_wal_size=32MB
# No replication: minimal WAL, which needs max_wal_senders=0.
wal_level=minimal
max_wal_senders=0
fsync=on
full_page_writes=on
# To the journal through stderr, with no statement text (LOG-SECRETS).
log_destination='stderr'
log_min_error_statement=panic
log_error_verbosity=terse
log_statement=none
