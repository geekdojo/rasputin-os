# mDNS responder — the appliance must answer <hostname>.local on any LAN so
# the first-run browser flow (https://rasputin.local, WebAuthn RP ID
# "rasputin.local") works with zero DNS infrastructure.
#
# Buildroot 2026.08 builds systemd 258.7 with the upstream meson default
# default-mdns=yes, so this drop-in is technically redundant — it exists to
# make the dependency EXPLICIT (a future Buildroot bump or a -Ddefault-mdns
# change upstream must not silently kill first-run discovery).
#
# The global switch is a ceiling: a link's effective mDNS mode is the lower of
# its per-link setting and this one. networkd's per-link MulticastDNS= defaults
# to no only on links networkd manages (here, the uplink in 20-wired.network,
# which sets yes); resolved gives a link with no networkd state a per-link yes.
# So this also turns mDNS on for docker0, br-* and veth*, which networkd does
# not manage.
[Resolve]
MulticastDNS=yes
