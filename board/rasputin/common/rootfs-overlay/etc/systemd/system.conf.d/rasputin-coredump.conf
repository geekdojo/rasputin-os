# Keep the core-dump size limit at zero for services, so only the unit that is
# meant to dump can.
#
# WHY THIS FILE IS THE OPPOSITE OF WHAT IT WAS. Until 2026-09-19 it said
# `DefaultLimitCORE=infinity`, with a comment claiming systemd leaves the soft
# limit at 0 unless told otherwise. That claim is wrong: systemd's PID 1 calls
# setrlimit(RLIMIT_CORE, infinity) for itself and every service it forks, and
# has since v215 (src/core/main.c initialize_coredump(), read at v256.17 — the
# version Buildroot 2025.02.17 builds; the NEWS entry is "The RLIMIT_CORE
# resource limit now defaults to unlimited for PID 1 and all forked
# processes"). So the old line changed nothing, and the image's real state was
# that EVERY service could write a core.
#
# WHY THAT MATTERS. A core is a byte-for-byte copy of a process's memory at the
# moment it died, and on this image cores land on the persistent partition
# (coredump.conf.d/rasputin.conf). Every service holding a credential — the
# api, the agent, tailscaled, Headscale, the broker — could therefore write it
# to disk on a crash. systemd-coredump is on this image for ONE diagnostic:
# the intermittent rauc double-free abort (rasputin-os#8). Only the unit that
# runs rauc needs the limit, so only that unit gets it.
#
# SOFT 0, HARD INFINITY. The soft limit is what the kernel checks when it
# decides whether to write a core, so 0 means no core. The hard limit stays
# infinity so a unit that needs to dump can raise its own soft limit without a
# privileged call — which is exactly what rasputin-agent.service's
# LimitCORE=infinity does. Lowering the hard limit too would make that unit's
# stanza fail instead.
#
# THE ONE UNIT THAT RAISES IT: etc/systemd/system/rasputin-agent.service.
# `rauc install` runs as a direct child of that process, and a child inherits
# the limit. Anything else that needs a core in future raises it on its own
# unit; do not bring the global raise back.
#
# NOT COVERED, and unchanged by this: an interactive SSH shell, whose
# RLIMIT_CORE comes from PAM/limits rather than from systemd. Reproducing #8 by
# hand still needs `ulimit -c unlimited` in that shell.
[Manager]
DefaultLimitCORE=0:infinity
