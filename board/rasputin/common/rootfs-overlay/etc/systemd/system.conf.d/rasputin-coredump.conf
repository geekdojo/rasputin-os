# Raise the default core-dump size limit for systemd-managed services so a
# crashing service can actually produce a core for systemd-coredump to capture.
#
# WHY: systemd only bumps RLIMIT_CORE for its services when this is set; without
# it the soft limit is often 0 and the kernel writes no core at all — the
# coredump.conf policy never even sees the crash. The real rauc OTA path runs
# under the rasputin-agent service, so this is what makes rasputin-os#8 (and any
# service crash) capturable under the normal update flow, not just a manual run.
#
# The actual disk footprint stays bounded by coredump.conf.d/rasputin.conf
# (ExternalSizeMax / MaxUse / KeepFree) — this only lets the core be written; the
# coredump policy caps how much is kept.
#
# NOTE: a MANUAL `rauc install` from an interactive SSH shell is NOT covered by
# this (shell RLIMIT_CORE comes from PAM/limits, not systemd) — run it with
# `ulimit -c unlimited` if reproducing that way. The original #8 repro was manual
# back-to-back installs; the real OTA path is service-driven and is covered.
[Manager]
DefaultLimitCORE=infinity
