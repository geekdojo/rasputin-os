# Rasputin coredump policy — bounded capture on the persistent partition.
#
# WHY: to diagnose the intermittent rauc double-free abort (rasputin-os#8) and
# any future crash, the next occurrence must leave a backtrace. Cores land in
# /var/lib/systemd/coredump, which on this image is a baked symlink onto the
# persistent partition (/var/lib/rasputin/coredump) — the rootfs is read-only
# squashfs, so /var/lib/systemd itself can't be written. See
# rootfs-overlay/var/lib/systemd/coredump and tmpfiles.d/rasputin.conf.
#
# SAFETY: the persistent partition can be small (a stuck-512 MiB partition has
# been seen). Unbounded cores could fill it and wedge the node, so every knob
# below is a hard cap. Compress keeps stored cores tiny (a rauc core is tens of
# MiB uncompressed → a few MiB xz). KeepFree is the load-bearing guard: coredump
# refuses to store rather than eat into the last 256 MiB of the partition.
#
# TUNE ON THE BENCH: these caps are conservative defaults chosen without knowing
# the real persistent-partition size on target. Confirm cores actually land
# (trigger a test crash) and adjust MaxUse/KeepFree to the measured partition.
[Coredump]
Storage=external
Compress=yes
# Largest core the handler will accept for processing (pre-compression).
ProcessSizeMax=256M
# Largest single stored (compressed) core.
ExternalSizeMax=64M
# Total disk the coredump store may use; oldest evicted past this.
MaxUse=128M
# Never let cores consume the last of the partition — this is the anti-wedge.
KeepFree=256M
