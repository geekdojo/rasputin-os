# journald storage and retention for this appliance. geekdojo/geekdojo-brain#601.
#
# Storage=persistent, NOT auto (which is the compiled-in default and is what
# was in effect until now). Under `auto` journald's choice is a side effect of
# whether /var/log/journal happens to exist and be writable; it is stated
# nowhere, and when it comes out "volatile" nothing says so. That is exactly
# how this defect survived: /var/log/journal is baked into the image but sits
# on the read-only squashfs, so every node quietly kept no history at all until
# the firewall outage in #547 needed it. `persistent` puts the intent in
# configuration where a test can read it, and makes journald create the tree
# itself rather than depending on the baked mountpoint surviving a future
# image change. It degrades exactly as `auto` did if
# rasputin-journal-store.service has not put the bind mount there: journald
# cannot create a directory on a read-only rootfs, so it stays on /run.
#
# ── retention ──────────────────────────────────────────────────────────────
# The defaults are derived from the size of the filesystem, and that filesystem
# is not a fixed size here: the image ships the persistent partition at 512M
# (genimage.cfg) and rasputin-growpart + x-systemd.growfs grow it to fill the
# medium on first boot — measured at 109.8G free on cp-compute4 and 219.2G on
# bench.local, and it would be different again on a different disk. A
# percentage therefore gives a different retention on every unit, and gives the
# SMALLEST retention on the node whose growpart failed, which is the node most
# likely to need reading. So all four are pinned.
#
# SystemMaxUse=512M — the steady-state cap. Measured on an idle cp-compute4:
# 11 entries / 9.6 KB per five minutes plus roughly 8 MB of boot burst, so this
# is on the order of a year of idle history, or about sixty boots' worth of
# burst, and it is ~0.5% of the smallest grown partition measured. Bounded in
# bytes rather than in percent, for the reason above.
#
# SystemKeepFree=4G — the neighbours' guarantee, and the setting that matters
# more than the cap. This partition also holds Docker and containerd image
# data, the api's data directory and agent state; a single app-tile pull is the
# largest single writer on it. journald enforces whichever of MaxUse and
# KeepFree binds first, so on a grown partition KeepFree never binds and
# MaxUse governs, while on an ungrown 512M partition KeepFree always binds and
# journald vacuums itself down to almost nothing — the journal yields to the
# neighbours, which is the right precedence for an appliance. 4G is also
# journald's own ceiling for this setting's default, so nothing is loosened
# here; it is pinned so that it stops being a function of partition size.
#
# SystemMaxFileSize=64M — equal to the default journald would derive at this
# MaxUse (one eighth), pinned so that changing MaxUse later cannot silently
# change rotation granularity too. Eight files at the cap means a vacuum drops
# at most 64M of history at a time instead of a large fraction of it.
#
# MaxRetentionSec=1month — an age ceiling independent of size. A quiet node
# never reaches the byte cap, so without this it would carry entries
# indefinitely. A month spans every diagnostic window we have actually needed
# (#547 was 22 hours) and bounds how far back an appliance sitting at a
# customer site keeps operational data.
[Journal]
Storage=persistent
SystemMaxUse=512M
SystemKeepFree=4G
SystemMaxFileSize=64M
MaxRetentionSec=1month
