# Run the ttyAMA10 login only on the board that has a connector for it
# (geekdojo/geekdojo-brain#321, F-321-43).
#
# The udev rule starts this getty wherever ttyAMA10 exists, and the one arm64
# image boots several boards that have it. Only the Raspberry Pi 5 Model B
# brings it out, on the 3-pin debug UART connector. The CM5 (and so the
# Super4C) and the Pi 500 have the device but no connector, so a login there
# would be a serial way that leads nowhere, and /repair would list it.
#
# The Pi 5 Model B's device tree carries the compatible string
# raspberrypi,5-model-b (bcm2712-rpi-5-b.dts, also included unchanged by its
# d0 and -d variants). The Pi 500 replaces it with raspberrypi,500 and the
# CM5 with raspberrypi,5-compute-module. systemd reads it from
# /proc/device-tree/compatible and the condition fails closed: no file, an
# unreadable one or no exact match leaves the unit skipped, never failed.
[Unit]
ConditionFirmware=device-tree-compatible(raspberrypi,5-model-b)
