# Keep stored core dumps readable by root only.
#
# A core is a byte-for-byte copy of a process's memory at the moment it died,
# so whatever that process was holding — a join token, a bus key, a session
# cookie, a passphrase — is in the file. These land on the persistent
# partition (see ../rasputin-coredump-store.service), so the mode is an
# at-rest question, not a transient one.
#
# TWO SEPARATE THINGS, because systemd sets them in two places:
#
# 1. THE DIRECTORY. systemd-coredump@.service declares
#    `StateDirectory=systemd/coredump`, and systemd applies StateDirectoryMode
#    to that directory every time the unit runs — default 0755, i.e. any uid
#    on the node could list the store and see which process died when. 0700
#    here also stops systemd from widening the 0700 that
#    rasputin-coredump-store.service creates the backing directory with.
#
# 2. THE FILES. systemd hard-codes the mode of a stored core: fix_permissions()
#    in src/coredump/coredump.c does `fchmod(fd, 0640)`, and coredump.conf has
#    no knob for it (read at v256.17, the version Buildroot 2025.02.17 builds).
#    So the only lever is after the fact, in the same unit that wrote the file:
#    ExecStopPost runs once ExecStart has linked the core into place.
#
# Neither is a substitute for the other. The directory mode is what keeps a
# non-root uid out; the file mode is what the at-rest rule asks for, and it is
# what survives if the store is ever copied somewhere with a laxer directory.
[Service]
StateDirectoryMode=0700
ExecStopPost=/usr/lib/rasputin/coredump/coredump-restrict-mode.sh
