# Pin the serial getty to 115,200 instead of Buildroot's --keep-baud.
#
# --keep-baud keeps whatever baud the port already has, and only a
# kernel console= on the cmdline sets ttyS0 to 115,200 at boot. The
# cmdline lives on the boot FATs, which RAUC never rewrites — so every
# node updated in place (rather than reflashed) boots its ttyS0 at the
# kernel-default 9,600 and the getty keeps it. The BMC serial console
# bridges at 115,200 (control-plane/bmc-bitscope.md §5): mismatch =
# silent console. Bit the whole rack after the 2026.07.5-dev.123
# update (bench 2026-07-26); every target needed a manual stty.
#
# Fixed baud makes the getty independent of cmdline/boot-FAT vintage.
[Service]
ExecStart=
ExecStart=-/sbin/agetty -o '-p -- \\u' 115200 %I $TERM
