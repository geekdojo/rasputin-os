# /var/lib/tailscale is a baked-in symlink to /var/lib/rasputin/tailscale (the
# rootfs is read-only squashfs; tailscaled's --state=/var/lib/tailscale/...
# follows the symlink onto the persistent partition). Same pattern as
# docker/containerd. Don't race the persistent mount.
[Unit]
RequiresMountsFor=/var/lib/rasputin

# Clear the upstream unit's CacheDirectory=tailscale. systemd creates a
# CacheDirectory under /var/cache, which is on the read-only squashfs — so the
# directive fails at step CACHE_DIRECTORY with EROFS and tailscaled never even
# execs (status=239/CACHE_DIRECTORY; the service then trips its start-limit and
# stays failed — bench 2026-06-18, dev.20: the controlplane's own tailscaled
# was down so it couldn't self-enroll). tailscaled doesn't need a persistent
# cache (it re-fetches the DERP map on start), so clear the directive rather
# than redirect it. An empty assignment resets the inherited value.
[Service]
CacheDirectory=

# Point StateDirectory= at the REAL directory, not the symlink. The upstream
# unit says StateDirectory=tailscale, i.e. /var/lib/tailscale, which on this
# image is the symlink above. systemd 256 followed it. systemd 258 does not:
# setup_exec_directory() now calls is_idmapping_supported() on the directory,
# which opens it with O_NOFOLLOW, so a symlinked state directory fails ELOOP
# and tailscaled never execs —
#
#     tailscaled.service: Failed to set up special execution directory in
#       /var/lib: Too many levels of symbolic links
#     tailscaled.service: Main process exited, status=238/STATE_DIRECTORY
#
# (QEMU arm64 smoke of the first Buildroot 2026.08 build, run 36935416907;
# src/core/exec-invoke.c and src/basic/namespace-util.c at v258.7; reproduced
# against Fedora's 256.17 and 258.7 builds, where the same unit starts on 256
# and fails on 258.) rasputin/tailscale is the same directory reached without
# the symlink, so tailscaled's --state path is unchanged.
#
# StateDirectoryMode is restated on purpose. The empty assignment that clears
# the upstream path also resets the mode to systemd's default 0755 (measured on
# both versions), which would chmod the node's tailscale keys directory
# world-traversable on every start. 0700 is upstream's own value and what
# usr/lib/rasputin/atrest/inventory declares for this path.
StateDirectory=
StateDirectory=rasputin/tailscale
StateDirectoryMode=0700
