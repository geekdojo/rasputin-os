# Persistent-partition directories that must exist before their consumers
# start. /var/lib/docker and /var/lib/containerd are baked-in symlinks onto
# the persistent partition (read-only squashfs rootfs); neither daemon will
# create the target of a dangling symlink itself — dockerd fails with
# "mkdir /var/lib/docker: file exists" (dev.4 bring-up).
# tmpfiles-setup orders after local-fs.target, i.e. after the persistent
# mount (nofail: if that mount failed these lines fail too, harmlessly —
# the daemons are gated by RequiresMountsFor drop-ins anyway).
d /var/lib/rasputin/docker     0710 root root -
d /var/lib/rasputin/containerd 0711 root root -
# tailscaled state: /var/lib/tailscale is a baked-in symlink onto the
# persistent partition (same as docker above). 0700 — tailscaled keeps node
# keys here.
d /var/lib/rasputin/tailscale  0700 root root -
# Mesh CA dir: holds the per-installation Mesh CA bundle (tailscaled-ca.pem)
# that the agent writes on enrollment, on the persistent partition so it
# survives reboots. tailscaled reads it via SSL_CERT_FILE (drop-in).
d /var/lib/rasputin/mesh       0700 root root -
# RAUC's data directory (system.conf data-directory=): per-slot installed
# version + boot history, and the adaptive-update block-hash index. RAUC would
# create it itself, but declaring it here gets the mode right and keeps every
# persistent-partition directory in one list. 0700 — root-only, like dropbear's.
d /var/lib/rasputin/rauc       0700 root root -

# The agent's state directory: the bus pin file, the BMC state, and the keys
# the agent generates for itself. Created by the agent at runtime until now,
# which meant its mode came from whatever umask systemd happened to hand it.
# 0700 — the pin decides which control plane the node will talk to.
d /var/lib/rasputin/agent-state 0700 root root -

# The console root password. /etc/shadow is a baked-in symlink onto this
# directory (post-build.sh), because the rootfs is a read-only squashfs and the
# control plane delivers a root password HASH that has to be writable at
# runtime (console.root_hash, rasputin-control-plane#363,
# geekdojo/geekdojo-brain#546).
#
# C copies the image's master copy in only when the destination does not exist,
# so first boot gets a shadow file with root LOCKED, and every later boot —
# including after an A/B update, which replaces the rootfs but not this
# partition — leaves a delivered hash exactly where it is. 0600 root:root: it
# is /etc/shadow.
#
# If this line ever fails, /etc/shadow dangles and NO password authenticates,
# which is the direction to fail in.
d /var/lib/rasputin/console 0700 root root -
C /var/lib/rasputin/console/shadow 0600 root root - /usr/share/factory/rasputin/shadow

# dropbear host keys: persistent so the SSH host identity is stable across
# reboots + A/B updates (read-only squashfs rootfs). dropbear.service also
# mkdir's this in ExecStartPre; declared here for ordering + clarity.
d /var/lib/rasputin/dropbear   0700 root root -

# Bridge the baked bundle-signing root CA into the api's writable trust
# dir. The image bakes the PUBLIC root at /etc/rasputin/trust/root-ca.pem
# (CI injects vars.RASPUTIN_ROOT_CA_PEM; RAUC's keyring reads it there
# directly), but the api's RASPUTIN_TRUST_DIR defaults to
# /var/lib/rasputin/trust — the persistent partition, because that's also
# where it must WRITE mesh-ca.{key,pem}. Without this line the setup
# wizard's "Verify PKI trust" step reads amber on a factory image (first
# Mu wizard run, 2026-06-12). Plain L (not L+): an operator-provided real
# file at the target wins over the baked root.
d /var/lib/rasputin/trust 0700 root root -
L /var/lib/rasputin/trust/root-ca.pem - - - - /etc/rasputin/trust/root-ca.pem

# NOTE: the journal store (/var/lib/rasputin/journal) is created 0700 +
# bind-mounted over /var/log/journal by rasputin-journal-store.service, NOT
# here — it has to exist before systemd-journal-flush.service, and
# tmpfiles-setup runs after that unit. Its mode is re-asserted every boot by
# zz-rasputin-journal.conf, which has to be a separate file that sorts AFTER
# stock systemd.conf; see that file for why.
#
# NOTE: the coredump store (/var/lib/rasputin/coredump) is created 0700 +
# bind-mounted over /var/lib/systemd/coredump by rasputin-coredump-store.service,
# NOT here — a baked symlink can't work because systemd-coredump's own device
# table creates /var/lib/systemd/coredump as a real directory during image
# assembly (a symlink there fails makedevs at build). See that unit +
# coredump.conf.d/rasputin.conf.
