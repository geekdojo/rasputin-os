# Keep the persistent journal store owner-only. geekdojo/geekdojo-brain#601.
#
# WHY THIS IS A SECOND FILE, AND WHY THE NAME STARTS WITH zz. Stock systemd
# ships, in /usr/lib/tmpfiles.d/systemd.conf:
#
#     z /var/log/journal 2755 root systemd-journal - -
#
# and systemd-tmpfiles-setup.service runs AFTER systemd-journal-flush.service
# (measured on cp-compute4), i.e. after rasputin-journal-store.service has
# bind-mounted /var/lib/rasputin/journal over /var/log/journal. So that line
# lands on OUR directory — the same inode — on every boot, and the unit's own
# chmod would be undone a moment later.
#
# systemd-tmpfiles reads every drop-in in lexicographic order of BASENAME
# across all its directories, and for two lines naming the same path the LAST
# one applied wins. Measured against real systemd-tmpfiles 256.17 (the image's
# version), starting each time from 2755 root:systemd-journal:
#
#     line in rasputin.conf        ("r" < "s", applied first)  -> 2755
#     line in zz-rasputin-*.conf   ("z" > "s", applied last)   -> 0700
#
# So this cannot live in rasputin.conf, and the name is load-bearing rather
# than decorative. test/persistent-journal-functional.sh pins both halves of
# that measurement against real systemd-tmpfiles, so a rename or an upstream
# reshuffle fails CI rather than quietly widening the mode on every node.
#
# WHY 0700 root:root AND NOT THE STOCK 2755 root:systemd-journal. 2755 grants
# world read+execute on the directory, and /var/log itself is 0777 on this
# image, so any uid on the node could list the journal tree. The group half of
# the stock mode buys nothing here: group systemd-journal has no members and
# the image has no interactive user but root, so nothing on this appliance
# reads the journal as anything other than root. The journal holds every log
# line the node produced — which includes the eviction audit trail (#500) and
# whatever a failing unit printed on its way down — and every other tree on the
# persistent partition that holds that class of record is owner-only. See
# usr/lib/rasputin/atrest/inventory, which declares this path.
#
# Non-recursive on purpose (z, not Z). The contents below this directory stay
# as journald and stock tmpfiles make them (the machine-id directory at 2755,
# system.journal at 0640 root:systemd-journal); they are unreachable regardless
# because traversal stops at this directory, which is the same argument the
# inventory makes for trust/, mesh/ and bus/.
z /var/log/journal 0700 root root - -
